[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pygf"
version = "0.1.0"
description = "Gradient forests for ecological and genomic turnover on geospatial data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.4",
  "geopandas>=0.14", "xarray>=2024.1", "rioxarray>=0.15", "dask[array]>=2024.1",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
notebook = ["matplotlib>=3.7", "jupyterlab>=4", "ipykernel>=6", "nbformat>=5", "nbclient>=0.10", "folium>=0.12", "mapclassify>=2.4"]
test = ["pytest>=8", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
